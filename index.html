<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твое состояние | Магия Потока</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --sand-dark: #c2a383;
            --sand-medium: #dfc4a8;
            --sand-light: #f5e6d3;
            --text-main: #4a3f35;
            --accent-btn: #5d4d3f;
            --secondary-btn: #8e735b;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; font-family: 'Cormorant Garamond', serif; 
            color: var(--text-main); background: var(--sand-dark);
        }

        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--sand-dark), var(--sand-medium), var(--sand-light));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            z-index: -1;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .screen { 
            position: absolute; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center; 
            transition: opacity 1s ease; 
            opacity: 0; pointer-events: none;
        }
        .active { opacity: 1; pointer-events: auto; }

        h1 { font-weight: 300; font-size: 26px; max-width: 85%; line-height: 1.3; margin-bottom: 30px; }
        
        input { 
            background: rgba(255, 255, 255, 0.2); border: none; 
            border-bottom: 2px solid var(--text-main); color: var(--text-main);
            padding: 15px; text-align: center; font-size: 22px; 
            outline: none; margin-bottom: 40px; font-family: inherit; width: 260px;
        }

        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 85%; max-width: 350px; }
        
        .choice-btn { 
            aspect-ratio: 1 / 1; border: 1px solid rgba(255,255,255,0.4); 
            background: rgba(255,255,255,0.25); backdrop-filter: blur(5px);
            border-radius: 20px; color: var(--text-main); cursor: pointer; 
            transition: 0.3s; font-size: 19px; font-family: inherit;
        }

        .result-img { 
            width: 60vw; max-width: 220px; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            margin-bottom: 20px; 
            animation: float 5s ease-in-out infinite, fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); filter: blur(10px); }
            to { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .result-text { font-style: italic; font-size: 21px; max-width: 80%; line-height: 1.5; margin-bottom: 25px; }

        .btn-main { 
            background: var(--accent-btn); color: #f5e6d3; 
            padding: 16px 35px; border-radius: 35px; 
            text-decoration: none; font-weight: 500; font-size: 16px;
            cursor: pointer; border: none; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 12px;
            font-family: inherit;
            display: inline-block;
        }

        .btn-secondary {
            background: var(--secondary-btn);
        }

        .btn-outline {
            background: transparent; border: 1px solid var(--accent-btn); color: var(--accent-btn);
            padding: 12px 25px; font-size: 14px; border-radius: 25px;
            cursor: pointer; font-family: inherit; margin-top: 5px;
        }

        .final-phrase { font-size: 24px; line-height: 1.6; max-width: 85%; font-style: italic; margin-bottom: 30px; }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>

    <div class="screen active" id="screen1">
        <h1>Прислушайся к себе...<br>Что ты чувствуешь сейчас?</h1>
        <input type="text" id="userName" placeholder="твое имя..." autocomplete="off">
        <button class="btn-main" onclick="goToChoices()">Начать погружение</button>
    </div>

    <div class="screen" id="screen2">
        <h1>Что откликается сейчас?</h1>
        <div class="choice-grid">
            <button class="choice-btn" onclick="showResult('tenderness')">Нежность</button>
            <button class="choice-btn" onclick="showResult('joy')">Радость</button>
            <button class="choice-btn" onclick="showResult('power')">Сила</button>
            <button class="choice-btn" onclick="showResult('character')">Характер</button>
        </div>
    </div>

    <div class="screen" id="screen3">
        <img id="resImg" class="result-img" src="">
        <p class="result-text" id="resText"></p>
        <button class="btn-main" onclick="shareMagic()">Поделиться с друзьями ✨</button>
        <button class="btn-main btn-secondary" onclick="showFinal()">Собрать свою целостность ✨</button>
        <button class="btn-outline" onclick="backToChoices()">Выбрать другое состояние</button>
    </div>

    <div class="screen" id="screen4">
        <p class="final-phrase" id="finalPhrase"></p>
        <button class="btn-main" onclick="shareMagic()">Поделиться с друзьями ✨</button>
        <a href="https://t.me/nekyhnya" target="_blank" class="btn-main btn-secondary">Создать свою историю ✨</a>
        <br>
        <button class="btn-outline" style="margin-top: 30px; border-color: rgba(74, 63, 53, 0.5);" onclick="location.reload()">
            Вернуться в начало
        </button>
    </div>

    <script>
        const imgs = ["img/11.png", "img/22.png", "img/33.png", "img/44.png"];
        imgs.forEach(s => { const i = new Image(); i.src = s; });

        let name = "";
        const results = {
            tenderness: { img: "img/11.png", text: "НЕЖНОСТЬ - это не слабость. Это смелость оставить сердце открытым, даже когда мир рушится." },
            joy: { img: "img/22.png", text: "РАДОСТЬ -это не вечный праздник. Это способность заметить блик солнца в луже, когда ты уже без сил." },
            power: { img: "img/33.png", text: "СИЛА - это не стальной кулак. Это умение встать на один раз больше, чем ты падаешь." },
            character: { img: "img/44.png", text: "ХАРАКТЕР - это не упрямство. Это верность своим ценностям, даже когда ты идёшь против ветра." }
        };

        function goToChoices() {
            name = document.getElementById('userName').value.trim();
            switchScreen('screen1', 'screen2');
        }

        function showResult(type) {
            const data = results[type];
            const imgEl = document.getElementById('resImg');
            imgEl.style.animation = 'none';
            imgEl.offsetHeight; 
            imgEl.style.animation = null;
            imgEl.src = data.img;
            document.getElementById('resText').innerHTML = (name ? name + ", " : "") + data.text;
            switchScreen('screen2', 'screen3');
        }

        function backToChoices() {
            switchScreen('screen3', 'screen2');
        }

        function showFinal() {
            const finalStart = name ? name + ", помни: <br>" : "";
            document.getElementById('finalPhrase').innerHTML = finalStart + "Твоя сила — в твоей многогранности. Ты — целая вселенная, в которой всегда достаточно света.";
            switchScreen('screen3', 'screen4');
        }

        function shareMagic() {
            if (navigator.share) {
                navigator.share({
                    title: 'Мое состояние',
                    text: 'Прислушайся к себе... Какое твоё состояние сегодня?',
                    url: window.location.href
                }).catch(console.error);
            } else {
                alert("Скопируйте ссылку и отправьте другу ✨");
            }
        }

        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.remove('active');
            setTimeout(() => {
                document.getElementById(toId).classList.add('active');
            }, 400);
        }
    </script>
</body>
</html>
