<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твое состояние | Поток Смыслов</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --sand-dark: #c2a383;
            --sand-medium: #dfc4a8;
            --sand-light: #f5e6d3;
            --text-main: #4a3f35;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; font-family: 'Cormorant Garamond', serif; 
            color: var(--text-main); 
        }

        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--sand-dark), var(--sand-medium), var(--sand-light));
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            z-index: -1;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .screen { 
            position: absolute; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center; 
            transition: opacity 0.8s ease; opacity: 0; pointer-events: none;
        }
        .active { opacity: 1 !important; pointer-events: auto !important; }

        h1 { font-weight: 300; font-size: 26px; max-width: 80%; line-height: 1.3; margin-bottom: 30px; }
        
        input { 
            background: rgba(255, 255, 255, 0.2); border: none; 
            border-bottom: 2px solid var(--text-main); color: var(--text-main);
            padding: 15px; text-align: center; font-size: 22px; 
            outline: none; margin-bottom: 40px; font-family: inherit; width: 260px;
            border-radius: 10px 10px 0 0;
        }

        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 85%; max-width: 350px; }
        
        .choice-btn { 
            aspect-ratio: 1 / 1; 
            border: 1px solid rgba(255,255,255,0.5); 
            background: rgba(255,255,255,0.25); backdrop-filter: blur(10px);
            border-radius: 20px; color: var(--text-main); cursor: pointer; 
            transition: 0.4s; font-size: 19px; font-family: inherit; font-weight: 500;
            display: flex; align-items: center; justify-content: center;
        }

        .result-img { 
            width: 50vw; max-width: 180px; border-radius: 15px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.08); 
            margin-bottom: 15px; animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .result-text { font-style: italic; font-size: 21px; max-width: 80%; line-height: 1.5; margin-bottom: 20px; }

        .btn-main { 
            background: #5d4d3f; color: #f5e6d3; 
            padding: 14px 30px; border-radius: 30px; 
            text-decoration: none; font-weight: 500; font-size: 15px;
            cursor: pointer; border: none; transition: 0.3s;
            margin-bottom: 10px;
        }
        .btn-outline {
            background: transparent; border: 1px solid #5d4d3f; color: #5d4d3f;
            margin-top: 5px; padding: 10px 20px; font-size: 13px; border-radius: 20px;
            cursor: pointer; font-family: inherit;
        }

        .final-phrase { font-size: 24px; line-height: 1.6; max-width: 85%; font-style: italic; }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>

    <audio id="bgMusic" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"></audio>

    <div class="screen active" id="screen1">
        <h1>Прислушайся к себе...<br>Как мне называть тебя?</h1>
        <input type="text" id="userName" placeholder="твое имя...">
        <button class="btn-main" onclick="goToChoices()">Начать погружение</button>
    </div>

    <div class="screen" id="screen2">
        <h1>Что откликается сейчас?</h1>
        <div class="choice-grid">
            <button class="choice-btn" onclick="showResult('tenderness')">Нежность</button>
            <button class="choice-btn" onclick="showResult('joy')">Радость</button>
            <button class="choice-btn" onclick="showResult('power')">Сила</button>
            <button class="choice-btn" onclick="showResult('character')">Характер</button>
        </div>
    </div>

    <div class="screen" id="screen3">
        <img id="resImg" class="result-img" src="">
        <p class="result-text" id="resText"></p>
        <button class="btn-main" onclick="shareMagic()">Поделиться с друзьями ✨</button>
        <button class="btn-outline" onclick="backToChoices()">Слушать сердце дальше...</button>
        <button class="btn-outline" style="border:none; opacity:0.7;" onclick="showFinal()">Делаем вывод</button>
    </div>

    <div class="screen" id="screen4">
        <p class="final-phrase" id="finalPhrase"></p>
        <button class="btn-main" onclick="shareMagic()" style="margin-top:20px;">Поделиться с друзьями ✨</button>
        <br>
        <a href="https://t.me/nekyhnya" target="_blank" class="btn-main" style="background:#8e735b;">За магией ко мне ✨</a>
        <p onclick="location.reload()" style="font-size: 12px; margin-top: 30px; opacity: 0.6; cursor: pointer;">Вернуться в начало</p>
    </div>

    <script>
        let name = "";
        const results = {
            tenderness: { img: "img/11.png", text: "НЕЖНОСТЬ - это не слабость. Это смелость оставить сердце открытым, даже когда мир рушится у тебя на глазах." },
            joy: { img: "img/22.png", text: "РАДОСТЬ - это не вечный праздник. Это способность заметить блик солнца в луже, когда ты уже без сил." },
            power: { img: "img/33.png", text: "СИЛА - это не стальной кулак. Это умение встать на один раз больше, чем ты падаешь." },
            character: { img: "img/44.png", text: "ХАРАКТЕР - это не упрямство. Это верность своим ценностям, даже когда ты идёшь против ветра." }
        };

        function goToChoices() {
            name = document.getElementById('userName').value.trim();
            switchScreen('screen1', 'screen2');
            const music = document.getElementById('bgMusic');
            music.volume = 0.6;
            music.play().catch(e => console.log("Музыка ждет клика"));
        }

        function showResult(type) {
            const data = results[type];
            document.getElementById('resImg').src = data.img;
            document.getElementById('resText').innerHTML = (name ? name + ", " : "") + data.text;
            switchScreen('screen2', 'screen3');
        }

        function backToChoices() {
            switchScreen('screen3', 'screen2');
        }

        function showFinal() {
            const finalStart = name ? name + ", помни: <br>" : "";
            document.getElementById('finalPhrase').innerHTML = finalStart + "Твоя сила — в твоей многогранности. Нежность не мешает твердости, а радость лишь подсвечивает твой характер. Ты — целая вселенная.";
            switchScreen('screen3', 'screen4');
        }

        function shareMagic() {
            if (navigator.share) {
                navigator.share({ title: 'Состояние', text: 'Посмотри...', url: window.location.href });
            } else {
                alert("Скопируйте ссылку из браузера ✨");
            }
        }

        function switchScreen(fromId, toId) {
            const from = document.getElementById(fromId);
            const to = document.getElementById(toId);
            
            from.classList.remove('active');
            
            setTimeout(() => {
                // Скрываем старый экран совсем
                from.style.display = 'none'; 
                // Показываем новый
                to.style.display = 'flex';
                setTimeout(() => {
                    to.classList.add('active');
                }, 50);
            }, 800);
        }
    </script>
</body>
</html>
