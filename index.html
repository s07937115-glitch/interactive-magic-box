<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твое состояние | Магия Потока</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --sand-dark: #c2a383;
            --sand-medium: #dfc4a8;
            --sand-light: #f5e6d3;
            --text-main: #4a3f35;
            --accent-btn: #5d4d3f;
            --secondary-btn: #8e735b;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; font-family: 'Cormorant Garamond', serif; 
            color: var(--text-main); background: var(--sand-dark);
            -webkit-tap-highlight-color: transparent;
        }

        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--sand-dark), var(--sand-medium), var(--sand-light));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            z-index: -1;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .screen { 
            position: absolute; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center; 
            transition: opacity 1s ease; 
            opacity: 0; pointer-events: none;
            padding: 15px; box-sizing: border-box;
        }
        .active { opacity: 1; pointer-events: auto; }

        h1 { font-weight: 300; font-size: 24px; line-height: 1.3; margin-bottom: 30px; max-width: 90%; }
        
        input { 
            background: rgba(255, 255, 255, 0.2); border: none; 
            border-bottom: 2px solid var(--text-main); color: var(--text-main);
            padding: 12px; text-align: center; font-size: 22px; 
            outline: none; margin-bottom: 35px; font-family: inherit; width: 80%; max-width: 250px;
        }

        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 90%; max-width: 320px; }
        
        .choice-btn { 
            aspect-ratio: 1 / 1; border: 1px solid rgba(255,255,255,0.4); 
            background: rgba(255,255,255,0.25); backdrop-filter: blur(8px);
            border-radius: 20px; color: var(--text-main); cursor: pointer; 
            transition: 0.3s; font-size: 18px; font-family: inherit;
        }

        .result-img { 
            width: 65vw; max-width: 220px; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            margin-bottom: 20px; 
            animation: float 5s ease-in-out infinite, fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); filter: blur(10px); }
            to { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .result-text { font-style: italic; font-size: 20px; max-width: 85%; line-height: 1.4; margin-bottom: 25px; }

        /* Кнопки теперь занимают 85% ширины экрана, но не более 280px */
        .btn-main { 
            background: var(--accent-btn); color: #f5e6d3; 
            padding: 16px 20px; border-radius: 40px; 
            text-decoration: none; font-weight: 500; font-size: 17px;
            cursor: pointer; border: none; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 12px; font-family: inherit;
            width: 85%; max-width: 280px; display: block;
            box-sizing: border-box;
        }

        .btn-secondary { background: var(--secondary-btn); }

        .btn-outline {
            background: transparent; border: 1.5px solid var(--accent-btn); color: var(--accent-btn);
            padding: 12px 20px; font-size: 16px; border-radius: 35px;
            cursor: pointer; font-family: inherit; margin-top: 5px; width: 85%; max-width: 280px;
            box-sizing: border-box;
        }

        .final-phrase { font-size: 22px; line-height: 1.5; max-width: 85%; font-style: italic; margin-bottom: 30px; }

        #toast {
            position: fixed; top: 20px; background: var(--accent-btn);
            color: white; padding: 10px 20px; border-radius: 20px;
            opacity: 0; transition: 0.5s; z-index: 1000; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <audio id="bgMusic" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
    </audio>
    
    <div id="toast">Ссылка скопирована ✨</div>

    <div class="screen active" id="screen1">
        <h1>Прислушайся к себе...<br>Что ты чувствуешь сейчас?</h1>
        <input type="text" id="userName" placeholder="твое имя..." autocomplete="off">
        <button class="btn-main" onclick="startExperience()" style="margin: 0 auto;">Начать погружение</button>
    </div>

    <div class="screen" id="screen2">
        <h1>Что откликается сейчас?</h1>
        <div class="choice-grid">
            <button class="choice-btn" onclick="showResult('tenderness')">Нежность</button>
            <button class="choice-btn" onclick="showResult('joy')">Радость</button>
            <button class="choice-btn" onclick="showResult('power')">Сила</button>
            <button class="choice-btn" onclick="showResult('character')">Характер</button>
        </div>
    </div>

    <div class="screen" id="screen3">
        <img id="resImg" class="result-img" src="">
        <p class="result-text" id="resText"></p>
        <button class="btn-main" onclick="shareMagic()" style="margin: 0 auto 12px auto;">Поделиться с друзьями ✨</button>
        <button class="btn-main btn-secondary" onclick="showFinal()" style="margin: 0 auto 12px auto;">Собрать свою целостность ✨</button>
        <button class="btn-outline" onclick="backToChoices()" style="margin: 0 auto;">Выбрать другое</button>
    </div>

    <div class="screen" id="screen4">
        <p class="final-phrase" id="finalPhrase"></p>
        <button class="btn-main" onclick="shareMagic()" style="margin: 0 auto 12px auto;">Поделиться с друзьями ✨</button>
        <a href="https://t.me/nekyhnya" target="_blank" class="btn-main btn-secondary" style="margin: 0 auto 12px auto;">Хочешь создать свою историю?✨</a>
        <button class="btn-outline" style="margin: 30px auto 0 auto;" onclick="location.reload()">В начало</button>
    </div>

    <script>
        let name = "";
        const audio = document.getElementById('bgMusic');

        const results = {
            tenderness: { img: "img/11.png", text: "НЕЖНОСТЬ - это не слабость. Это смелость оставить сердце открытым." },
            joy: { img: "img/22.png", text: "РАДОСТЬ - это не вечный праздник. Это способность заметить блик солнца." },
            power: { img: "img/33.png", text: "СИЛА - это не стальной кулак. Это умение встать на один раз больше." },
            character: { img: "img/44.png", text: "ХАРАКТЕР - это не упрямство. Это верность своим ценностям." }
        };

        function startExperience() {
            name = document.getElementById('userName').value.trim();
            audio.play().catch(e => console.log("Музыка ждет клика"));
            switchScreen('screen1', 'screen2');
        }

        function showResult(type) {
            const data = results[type];
            const imgEl = document.getElementById('resImg');
            imgEl.src = data.img;
            document.getElementById('resText').innerHTML = (name ? name + ", " : "") + data.text;
            switchScreen('screen2', 'screen3');
        }

        function backToChoices() { switchScreen('screen3', 'screen2'); }

        function showFinal() {
            const finalStart = name ? name + ", помни: <br>" : "";
            document.getElementById('finalPhrase').innerHTML = finalStart + "Твоя сила — в твоей многогранности. Ты — целая вселенная.";
            switchScreen('screen3', 'screen4');
        }

        function shareMagic() {
            const shareData = {
                title: 'Магия Потока',
                text: 'Узнай свое состояние сегодня ✨',
                url: window.location.href
            };

            // Чистый вызов меню выбора контактов
            if (navigator.share) {
                navigator.share(shareData)
                .then(() => {
                    console.log('Пользователь поделился!');
                })
                .catch((err) => {
                    // Если не сработало, просто выведем подсказку
                    if (err.name !== 'AbortError') {
                        alert("Нажмите на адресную строку и скопируйте ссылку, чтобы отправить её другу ✨");
                    }
                });
            } else {
                alert("Ваш браузер не поддерживает быстрый выбор контактов. Просто скопируйте ссылку из адресной строки ✨");
            }
        }
        function copyToClipboard(text) {
            const input = document.createElement('textarea');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            const toast = document.getElementById('toast');
            toast.style.opacity = "1";
            setTimeout(() => { toast.style.opacity = "0"; }, 2500);
        }

        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.remove('active');
            setTimeout(() => {
                document.getElementById(toId).classList.add('active');
            }, 400);
        }
    </script>
</body>
</html>
