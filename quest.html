<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тайная комната | Квест</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #2c3e50; font-family: 'Montserrat', sans-serif;
            overflow: hidden; color: white;
        }

        /* СЕЙФ */
        #safe-container {
            width: 250px; height: 250px;
            background: #7f8c8d; border: 8px solid #34495e;
            border-radius: 20px; position: relative;
            transition: transform 0.3s, background 0.3s;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 20px 0 #2c3e50;
        }

        /* Ручка сейфа */
        .handle {
            width: 80px; height: 80px; border: 8px solid #bdc3c7;
            border-radius: 50%; position: relative;
            transition: transform 1s;
        }

        /* ИНДИКАТОРЫ (Огоньки) */
        .lights {
            position: absolute; top: -40px; display: flex; gap: 20px;
        }
        .light {
            width: 20px; height: 20px; background: #444; border-radius: 50%;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        /* ПОЛЕ ВВОДА */
        .code-input {
            margin-top: 50px; display: flex; gap: 15px;
        }
        .digit {
            width: 50px; height: 60px; background: #ecf0f1;
            border-radius: 10px; color: #2c3e50; font-size: 32px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 0 #bdc3c7;
        }

        /* АНИМАЦИИ */
        .error { animation: shake 0.5s, turnAway 0.5s; background: #e74c3c !important; }
        .success-light { background: #2ecc71 !important; box-shadow: 0 0 15px #2ecc71 !important; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        @keyframes turnAway {
            50% { transform: rotate(-15deg) scale(0.9); }
        }

        .open-safe { transform: scale(1.1) rotateY(110deg); origin: left; transition: 1.5s; }

        .hint { margin-top: 20px; font-family: 'Pacifico', cursive; color: #f1c40f; font-size: 20px; }
    </style>
</head>
<body>

    <div class="lights">
        <div class="light" id="l1"></div>
        <div class="light" id="l2"></div>
        <div class="light" id="l3"></div>
    </div>

    <div id="safe-container">
        <div class="handle" id="handle"></div>
    </div>

    <div class="code-input">
        <div class="digit" id="d1">?</div>
        <div class="digit" id="d2">?</div>
        <div class="digit" id="d3">?</div>
    </div>

    <p class="hint" id="message">Угадай первую цифру! (Подсказка: 1+2)</p>

    <div style="margin-top: 30px; display: flex; gap: 10px;">
        <button onclick="checkDigit(1)">1</button>
        <button onclick="checkDigit(3)">3</button>
        <button onclick="checkDigit(5)">5</button>
        <button onclick="checkDigit(7)">7</button>
    </div>

    <script>
        const correctCode = [3, 7, 5]; // Наш секретный код
        let currentStep = 0;

        function checkDigit(num) {
            const safe = document.getElementById('safe-container');
            const msg = document.getElementById('message');

            if (num === correctCode[currentStep]) {
                // ПРАВИЛЬНО
                document.getElementById(`l${currentStep + 1}`).classList.add('success-light');
                document.getElementById(`d${currentStep + 1}`).innerText = num;
                currentStep++;
                
                // Радостная реакция
                safe.style.background = '#27ae60';
                setTimeout(() => safe.style.background = '#7f8c8d', 500);
                
                if (currentStep === 1) msg.innerText = "Верно! Теперь вторая... (Дней в неделе)";
                if (currentStep === 2) msg.innerText = "Почти! Последняя... (Дай пять!)";
                
                if (currentStep === 3) {
                    openSafe();
                }
            } else {
                // ОШИБКА
                safe.classList.add('error');
                msg.innerText = "Ой! Сейф обиделся... Попробуй еще раз!";
                setTimeout(() => {
                    safe.classList.remove('error');
                }, 500);
            }
        }

        function openSafe() {
            document.getElementById('handle').style.transform = 'rotate(360deg)';
            setTimeout(() => {
                document.getElementById('safe-container').style.transformOrigin = 'left';
                document.getElementById('safe-container').style.transform = 'perspective(1000px) rotateY(-110deg)';
                document.getElementById('message').innerText = "УРА! ЗАГЛЯНИ ПОД ПОДУШКУ! 🎉";
                document.body.style.background = '#f1c40f';
            }, 1000);
        }
    </script>
</body>
</html>
