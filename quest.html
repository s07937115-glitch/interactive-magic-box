<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тайная комната | Квест</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Pacifico&display=swap" rel="stylesheet">
<style>
    /* ОБНОВЛЕННЫЙ ВИЗУАЛ СЕЙФА */
    #safe-container {
        width: 260px; height: 300px;
        background: linear-gradient(145deg, #7f8c8d, #34495e); /* Градиент металла */
        border: 10px solid #2c3e50;
        border-radius: 20px; position: relative;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        box-shadow: 20px 20px 60px #1a252f, -5px -5px 20px #3e5871;
        transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* ЗОЛОТЫЕ ЗАКЛЕПКИ ПО УГЛАМ */
    #safe-container::before, #safe-container::after {
        content: ''; position: absolute; width: 15px; height: 15px;
        background: radial-gradient(circle, #f1c40f, #d4af37);
        border-radius: 50%; border: 2px solid #917a07;
    }
    /* Располагаем их (для примера две, можно четыре) */
    #safe-container::before { top: 15px; left: 15px; box-shadow: 215px 0 #f1c40f, 0 240px #f1c40f, 215px 240px #f1c40f; }

    /* ШТУРВАЛ (РУЧКА) */
    .handle {
        width: 100px; height: 100px;
        background: #bdc3c7; border: 8px solid #95a5a6;
        border-radius: 50%; position: relative;
        display: flex; align-items: center; justify-content: center;
        box-shadow: inset 2px 2px 5px white, 5px 5px 15px rgba(0,0,0,0.3);
    }

    /* Спицы штурвала */
    .handle::before {
        content: ''; position: absolute; width: 120%; height: 10px;
        background: #95a5a6; border-radius: 5px;
    }
    .handle::after {
        content: ''; position: absolute; width: 10px; height: 120%;
        background: #95a5a6; border-radius: 5px;
    }

    /* ЭКРАНЧИК НА СЕЙФЕ */
    .safe-display {
        width: 120px; height: 40px; background: #1a1a1a;
        border-radius: 5px; margin-bottom: 20px;
        border: 3px solid #34495e;
        display: flex; align-items: center; justify-content: center;
        color: #2ecc71; font-family: 'Courier New', monospace;
        font-size: 20px; box-shadow: inset 0 0 10px #000;
    }

    /* Эффект обиженного сейфа (покраснение всего корпуса) */
    .angry-safe {
        background: linear-gradient(145deg, #e74c3c, #c0392b) !important;
        animation: shake 0.5s ease-in-out;
    }
</style>

<div id="safe-container">
    <div class="safe-display" id="main-display">LOCKED</div>
    <div class="handle" id="handle">
        <div style="width:20px; height:20px; background:#7f8c8d; border-radius:50%; z-index:10;"></div>
    </div>
</div>
    <script>
        const correctCode = [3, 7, 5]; // Наш секретный код
        let currentStep = 0;

        function checkDigit(num) {
            const safe = document.getElementById('safe-container');
            const msg = document.getElementById('message');

            if (num === correctCode[currentStep]) {
                // ПРАВИЛЬНО
                document.getElementById(`l${currentStep + 1}`).classList.add('success-light');
                document.getElementById(`d${currentStep + 1}`).innerText = num;
                currentStep++;
                
                // Радостная реакция
                safe.style.background = '#27ae60';
                setTimeout(() => safe.style.background = '#7f8c8d', 500);
                
                if (currentStep === 1) msg.innerText = "Верно! Теперь вторая... (Дней в неделе)";
                if (currentStep === 2) msg.innerText = "Почти! Последняя... (Дай пять!)";
                
                if (currentStep === 3) {
                    openSafe();
                }
            } else {
                // ОШИБКА
                safe.classList.add('error');
                msg.innerText = "Ой! Сейф обиделся... Попробуй еще раз!";
                setTimeout(() => {
                    safe.classList.remove('error');
                }, 500);
            }
        }

        function openSafe() {
            document.getElementById('handle').style.transform = 'rotate(360deg)';
            setTimeout(() => {
                document.getElementById('safe-container').style.transformOrigin = 'left';
                document.getElementById('safe-container').style.transform = 'perspective(1000px) rotateY(-110deg)';
                document.getElementById('message').innerText = "УРА! ЗАГЛЯНИ ПОД ПОДУШКУ! 🎉";
                document.body.style.background = '#f1c40f';
            }, 1000);
        }
    </script>
</body>
</html>
