<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пятничный Форсаж: Битва за БОНУС</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .card {
            background: #1e1e1e;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            max-width: 420px;
            width: 100%;
            overflow: hidden;
            border: 3px solid #ffcc00;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
            background: #252525;
            min-height: 200px;
        }
        .content {
            padding: 25px 20px;
        }
        h2 { color: #ffcc00; margin: 0 0 15px 0; text-transform: uppercase; font-size: 1.5rem; }
        p { line-height: 1.6; font-size: 1.1rem; margin: 0; color: #e0e0e0; }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 25px 25px;
        }
        button {
            padding: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.2s;
        }
        .btn-main { 
            background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%); 
            color: #000; 
            box-shadow: 0 5px #996600;
        }
        .btn-main:active { transform: translateY(3px); box-shadow: 0 2px #996600; }
        
        .nav-panel {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .btn-nav { 
            background: none; 
            color: #666; 
            text-decoration: underline; 
            font-size: 0.85rem; 
            cursor: pointer; 
            border: none;
            padding: 5px;
        }
        .btn-nav:hover { color: #ffcc00; }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="fast_and_docs.mp3" type="audio/mpeg">
    </audio>

    <div class="card" id="game-card">
        <img id="main-img" src="img/start_race.jpg" alt="Пятница">
        
        <div class="content">
            <h2 id="title">🚨 ЗАГРУЗКА...</h2>
            <p id="description">Подожди секунду, прогреваем моторы!</p>
        </div>

        <div class="btn-group" id="buttons"></div>
        
        <div class="nav-panel">
            <button class="btn-nav" onclick="goBack()">⬅️ Назад</button>
            <button class="btn-nav" id="music-btn" onclick="toggleMusic()">🔇 Музыка</button>
            <button class="btn-nav" onclick="restart()">🏠 В начало</button>
        </div>
    </div>

    <script>
        const states = {
            pre_start: {
                img: 'img/start_race.jpg',
                title: '🚨 ПРИСТЕГНИТЕСЬ!',
                text: 'Это твой шанс сделать эту пятницу легендарной. Готов к Форсажу?',
                btns: [{ text: '🚀 СТАРТ КВЕСТА!', next: 'start' }]
            },
            start: {
                img: 'img/start_race.jpg',
                title: '🚨 ВНИМАНИЕ!',
                text: 'Только сегодня — секретный РОЗЫГРЫШ! Бонус заберет тот, кто успеет сдать документы до 15:00.',
                btns: [
                    { text: 'Участвовать в розыгрыше', next: 'choice' }, 
                    { text: 'Остаться в стороне', next: 'slow' }
                ]
            },
            slow: {
                img: 'img/driver_slow.jpg',
                title: '🐌 ТЫ ГДЕ?',
                text: 'Пока ты плетешься в правом ряду, кто-то другой забирает твой фарт! Но шанс еще есть.',
                btns: [{ text: 'Я ПЕРЕДУМАЛ, ГАЗУЕМ!', next: 'choice' }]
            },
            choice: {
                img: 'img/driver_fast.jpg',
                title: '🏎 ГАЗ В ПОЛ!',
                text: 'Твоё имя в списке! Лети как ветер! Светлана Юрьевна и Татьяна уже ждут возвраты - развраты.',
                btns: [{ text: '💎 ВЫБРАТЬ БОНУС', next: 'bonus' }]
            },
            bonus: {
                img: 'img/final_bonus.jpg',
                title: '🔥 ФИНАЛ',
                text: 'Выбирай !!! От кого ты хочешь получить приз и заветный БОНУС?',
                btns: [
                    { text: '👑 От Светланы Юрьевны', next: 'svetlana' },
                    { text: '🧚‍♀️ От Татьяны', next: 'tatyana' }
                ]
            },
            svetlana: {
                img: 'img/boss_svetlana.jpg',
                title: '👑 ОДОБРЕНО',
                text: 'Светлана Юрьевна включила "Зеленый коридор". Возвраты - развраты приняты без досмотра. Приз + бонус ждут тебя!',
                btns: [{ text: '🎫 ПОЛУЧИТЬ БИЛЕТ', next: 'weekend_ticket' }]
            },
            tatyana: {
                img: 'img/girl_tatyana.jpg',
                title: '✨ МАГИЯ',
                text: 'Татьяна приняла документы онлайн — и ты свободен! Быстрее забирай приз.',
                btns: [{ text: '🎫 ПОЛУЧИТЬ БИЛЕТ', next: 'weekend_ticket' }]
            },
            weekend_ticket: {
                img: 'img/weekend_ticket.jpg',
                title: '🎫 ТВОЙ БИЛЕТ!',
                text: 'Твой Билет на Удачные Выходные активирован! Почти... Осталось забрать главный сюрприз.',
                btns: [{ text: '🎁 АКТИВИРОВАТЬ БОНУС', next: 'bonus_finish' }]
            },
            bonus_finish: {
                img: 'img/final_bonus.jpg',
                title: '💣 ГЛАВНЫЙ БОНУС!',
                text: 'И дааа... завтра на работу можешь не приходить! 😂 Удачных выходных!',
                btns: []
            }
        };

        let history = ['pre_start'];
        const music = document.getElementById('bg-music');
        let musicStarted = false;

        function render(stateKey) {
            const state = states[stateKey];
            document.getElementById('main-img').src = state.img;
            document.getElementById('title').innerText = state.title;
            document.getElementById('description').innerText = state.text;
            
            const btnGroup = document.getElementById('buttons');
            btnGroup.innerHTML = '';
            
            state.btns.forEach(btn => {
                const b = document.createElement('button');
                b.className = 'btn-main';
                b.innerText = btn.text;
                b.onclick = () => {
                    // Музыкальная активация
                    if (!musicStarted) {
                        music.play().then(() => {
                            musicStarted = true;
                            document.getElementById('music-btn').innerText = '🔊 Музыка';
                        }).catch(e => console.log("Клик принят, звук наготове"));
                    }
                    
                    history.push(btn.next);
                    render(btn.next);
                };
                btnGroup.appendChild(b);
            });
        }

        function toggleMusic() {
            if (music.paused) {
                music.play();
                document.getElementById('music-btn').innerText = '🔊 Музыка';
            } else {
                music.pause();
                document.getElementById('music-btn').innerText = '🔇 Музыка';
            }
        }

        function goBack() {
            if (history.length > 1) {
                history.pop();
                render(history[history.length - 1]);
            }
        }

        function restart() {
            history = ['pre_start'];
            render('pre_start');
        }

        // Первый запуск
        render('pre_start');
    </script>
</body>
</html>
