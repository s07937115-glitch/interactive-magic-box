<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пятничный Форсаж</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #2a2a2a;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            border: 2px solid #ffcc00;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
        }
        .content {
            padding: 20px;
        }
        h2 { color: #ffcc00; margin-top: 0; }
        p { line-height: 1.5; font-size: 1.1rem; }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 20px 20px;
        }
        button {
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
        }
        .btn-main { background: #ffcc00; color: #000; }
        .btn-alt { background: #444; color: #fff; }
        .btn-nav { background: none; color: #888; text-decoration: underline; font-size: 0.8rem; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card" id="game-card">
        <img id="main-img" src="start_race.jpg" alt="Пятница">
        
        <div class="content">
            <h2 id="title">🚨 ВНИМАНИЕ!</h2>
            <p id="description">Только сегодня в нашем офисе происходит то, чего не было никогда! Мы запускаем ПЯТНИЧНЫЙ ФОРСАЖ!</p>
        </div>

        <div class="btn-group" id="buttons">
            </div>
        
        <div style="margin-bottom: 10px;">
            <button class="btn-nav" onclick="goBack()">⬅️ Назад</button>
            <button class="btn-nav" onclick="restart()">🏠 В начало</button>
        </div>
    </div>

    <script>
        const states = {
            start: {
                img: 'start_race.jpg',
                title: '🚨 ВНИМАНИЕ!',
                text: 'Только сегодня — секретный РОЗЫГРЫШ! Приз заберет тот, кто приедет к 15:00.',
                btns: [{ text: 'Участвовать в розыгрыше', next: 'choice' }, { text: 'Остаться в стороне', next: 'slow' }]
            },
            slow: {
                img: 'driver_slow.jpg',
                title: '🐌 ТЫ ГДЕ?',
                text: 'Пока ты плетешься в правом ряду, кто-то другой забирает твой фарт! Но шанс еще есть.',
                btns: [{ text: 'Я ПЕРЕДУМАЛ, ГАЗУЕМ!', next: 'choice' }]
            },
            choice: {
                img: 'driver_fast.jpg',
                title: '🏎 ГАЗ В ПОЛ!',
                text: 'Твоё имя в списке! Лети как ветер! Светлана Юрьевна и Татьяна уже ждут твои развраты.',
                btns: [{ text: 'ЗАБРАТЬ БОНУС', next: 'bonus' }]
            },
            bonus: {
                img: 'final_bonus.jpg',
                title: '🔥 ФИНАЛ',
                text: 'Чьё благословение на быструю приемку ты выберешь?',
                btns: [
                    { text: 'У Светланы Юрьевны', next: 'svetlana' },
                    { text: 'У Татьяны', next: 'tatyana' }
                ]
            },
            svetlana: {
                img: 'boss_svetlana.jpg',
                title: '👑 ОДОБРЕНО',
                text: 'Светлана Юрьевна включила "Зеленый коридор". Развраты приняты без досмотра. Домой!',
                btns: []
            },
            tatyana: {
                img: 'girl_tatyana.jpg',
                title: '✨ МАГИЯ',
                text: 'Татьяна взмахнула степлером — и ты свободен! Хороших выходных!',
                btns: []
            }
        };

        let history = ['start'];

        function render(stateKey) {
            const state = states[stateKey];
            document.getElementById('main-img').src = state.img;
            document.getElementById('title').innerText = state.title;
            document.getElementById('description').innerText = state.text;
            
            const btnGroup = document.getElementById('buttons');
            btnGroup.innerHTML = '';
            
            state.btns.forEach(btn => {
                const b = document.createElement('button');
                b.className = 'btn-main';
                b.innerText = btn.text;
                b.onclick = () => {
                    history.push(btn.next);
                    render(btn.next);
                };
                btnGroup.appendChild(b);
            });
        }

        function goBack() {
            if (history.length > 1) {
                history.pop();
                render(history[history.length - 1]);
            }
        }

        function restart() {
            history = ['start'];
            render('start');
        }

        // Запуск
        render('start');
    </script>
</body>
</html>
