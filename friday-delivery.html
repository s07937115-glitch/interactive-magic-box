<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пятничный Форсаж</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #2a2a2a;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            border: 2px solid #ffcc00;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
            min-height: 200px;
            background: #333;
        }
        .content {
            padding: 20px;
        }
        h2 { color: #ffcc00; margin-top: 0; text-transform: uppercase; }
        p { line-height: 1.5; font-size: 1.1rem; }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 20px 20px;
        }
        button {
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
        }
        .btn-main { background: #ffcc00; color: #000; box-shadow: 0 4px #b89600; }
        .btn-main:active { transform: translateY(4px); box-shadow: none; }
        .btn-nav { background: none; color: #888; text-decoration: underline; font-size: 0.8rem; margin: 5px; cursor: pointer; border: none; }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="music/fast_and_docs.mp3" type="audio/mpeg">
    </audio>

    <div class="card" id="game-card">
        <img id="main-img" src="img/start_race.jpg" alt="Форсаж">
        
        <div class="content">
            <h2 id="title">🚨 ПРИСТЕГНИТЕСЬ!</h2>
            <p id="description">Это твой шанс сделать эту пятницу легендарной. Погнали!</p>
        </div>

        <div class="btn-group" id="buttons">
            </div>
        
        <div style="margin-bottom: 10px; display: flex; justify-content: center; gap: 15px;">
            <button class="btn-nav" onclick="goBack()">⬅️ Назад</button>
            <button class="btn-nav" id="music-btn" onclick="toggleMusic()">🔇 Музыка</button>
            <button class="btn-nav" onclick="restart()">🏠 В начало</button>
        </div>
    </div>

    <script>
        const states = {
            pre_start: {
                img: 'img/start_race.jpg',
                title: '🚨 ПРИСТЕГНИТЕСЬ!',
                text: 'Это твой шанс сделать эту пятницу легендарной. Готов к Форсажу?',
                btns: [{ text: '🚀 СТАРТ КВЕСТА!', next: 'start' }]
            },
            start: {
                img: 'img/start_race.jpg',
                title: '🚨 ВНИМАНИЕ!',
                text: 'Только сегодня — секретный РОЗЫГРЫШ! Приз заберет тот, кто приедет к 15:00.',
                btns: [
                    { text: 'Участвовать в розыгрыше', next: 'choice' }, 
                    { text: 'Остаться в стороне', next: 'slow' }
                ]
            },
            slow: {
                img: 'img/driver_slow.jpg',
                title: '🐌 ТЫ ГДЕ?',
                text: 'Пока ты плетешься в правом ряду, кто-то другой забирает твой фарт! Но шанс еще есть.',
                btns: [{ text: 'Я ПЕРЕДУМАЛ, ГАЗУЕМ!', next: 'choice' }]
            },
            choice: {
                img: 'img/driver_fast.jpg',
                title: '🏎 ГАЗ В ПОЛ!',
                text: 'Твоё имя в списке! Лети как ветер! Светлана Юрьевна и Татьяна уже ждут твои развраты.',
                btns: [{ text: 'ЗАБРАТЬ БОНУС', next: 'bonus' }]
            },
            bonus: {
                img: 'img/final_bonus.jpg',
                title: '🔥 ФИНАЛ',
                text: 'Чьё благословение на быструю приемку ты выберешь?',
                btns: [
                    { text: 'У Светланы Юрьевны', next: 'svetlana' },
                    { text: 'У Татьяны', next: 'tatyana' }
                ]
            },
            svetlana: {
                img: 'img/boss_svetlana.jpg',
                title: '👑 ОДОБРЕНО',
                text: 'Светлана Юрьевна включила "Зеленый коридор". Развраты приняты без досмотра. Домой!',
                btns: []
            },
            tatyana: {
                img: 'img/girl_tatyana.jpg',
                title: '✨ МАГИЯ',
                text: 'Татьяна взмахнула степлером — и ты свободен! Хороших выходных!',
                btns: []
            }
        };

        let history = ['pre_start'];
        const music = document.getElementById('bg-music');
        let musicStarted = false;

        // Принудительная попытка включить звук при любом клике по документу
        document.body.addEventListener('click', function() {
            if (!musicStarted) {
                music.play().then(() => {
                    musicStarted = true;
                    document.getElementById('music-btn').innerText = '🔊 Музыка';
                }).catch(e => console.log("Браузер всё ещё блокирует звук"));
            }
        }, { once: false });

        function render(stateKey) {
            const state = states[stateKey];
            document.getElementById('main-img').src = state.img;
            document.getElementById('title').innerText = state.title;
            document.getElementById('description').innerText = state.text;
            
            const btnGroup = document.getElementById('buttons');
            btnGroup.innerHTML = '';
            
            state.btns.forEach(btn => {
                const b = document.createElement('button');
                b.className = 'btn-main';
                b.innerText = btn.text;
                b.onclick = (e) => {
                    e.stopPropagation(); // Чтобы не срабатывал клик по body дважды
                    history.push(btn.next);
                    render(btn.next);
                    
                    if (!musicStarted) {
                        music.play();
                        musicStarted = true;
                        document.getElementById('music-btn').innerText = '🔊 Музыка';
                    }
                };
                btnGroup.appendChild(b);
            });
        }

        function toggleMusic() {
            if (music.paused) {
                music.play();
                document.getElementById('music-btn').innerText = '🔊 Музыка';
            } else {
                music.pause();
                document.getElementById('music-btn').innerText = '🔇 Музыка';
            }
        }

        function goBack() {
            if (history.length > 1) {
                history.pop();
                render(history[history.length - 1]);
            }
        }

        function restart() {
            history = ['pre_start'];
            render('pre_start');
        }

        render('pre_start');
    </script>
</body>
</html>
