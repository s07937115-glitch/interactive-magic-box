<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оракул Таро | Магия Потока</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --sand-dark: #c2a383;
            --sand-light: #f5e6d3;
            --text-main: #4a3f35;
            --gold: #d4af37;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; font-family: 'Cormorant Garamond', serif; 
            background: radial-gradient(circle, var(--sand-light), var(--sand-dark));
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        h1 { font-weight: 300; font-size: 28px; color: var(--text-main); margin-bottom: 20px; text-align: center; }

        /* Контейнер для появления карты */
        .card-box {
            width: 280px; height: 450px;
            perspective: 1000px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(30px);
            transition: 1.5s ease-out;
        }

        .card-box.active {
            opacity: 1; transform: translateY(0);
        }

        .card-img {
            width: 100%; height: 100%;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            border: 3px solid var(--gold);
            object-fit: cover;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        .btn-oracle {
            margin-top: 30px;
            background: var(--text-main); color: var(--sand-light);
            padding: 15px 30px; border-radius: 30px;
            border: none; font-family: inherit; font-size: 18px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .btn-oracle:active { transform: scale(0.95); }

        .meaning {
            margin-top: 20px; font-style: italic; font-size: 20px;
            color: var(--text-main); max-width: 80%; text-align: center;
            opacity: 0; transition: 2s;
        }

        .meaning.show { opacity: 1; }
    </style>
</head>
<body>

    <h1>Твое Послание Звезд</h1>

    <div class="card-box" id="cardContainer">
        <img src="img/thestar.png" class="card-img" alt="Карта Таро">
    </div>

    <div class="meaning" id="textMeaning">
        «Звезда дарит надежду. Твой путь освещен, просто доверься течению...»
    </div>

    <button class="btn-oracle" onclick="revealCard()">Получить предсказание</button>

    <script>
        function revealCard() {
            // Показываем карту
            document.getElementById('cardContainer').classList.add('active');
            // С небольшой задержкой показываем текст
            setTimeout(() => {
                document.getElementById('textMeaning').classList.add('show');
            }, 1000);
            
            // Скрываем кнопку после нажатия
            event.target.style.display = 'none';
        }
    </script>
</body>
</html>
